name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: my-project

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-project/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Start Supabase (Postgres, Auth, Storage)
        run: npx supabase start -x realtime,studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Database tests (RLS + SQL functions)
        run: npx supabase test db
      - name: Export Supabase env for the app
        run: |
          npx supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (mobile RTL + axe)
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
